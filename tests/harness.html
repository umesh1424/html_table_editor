<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LevelUp Test Harness</title>
</head>
<body>
  <div id="status">Waiting...</div>
  <iframe id="editorFrame" src="../index.html" style="width: 1000px; height: 700px;"></iframe>
  <script>
    window.receivedMessages = [];
    window.addEventListener('message', (event) => {
      window.receivedMessages.push(event.data);
      if (event.data && event.data.type === 'EDITOR_READY') {
        document.getElementById('status').textContent = 'READY_RECEIVED';
      }
    });
  </script>
</body>
</html>
